[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rtxmw-esm = { path = "crates/rtxmw-esm" }
rtxmw-gpu = { path = "crates/rtxmw-gpu" }
rtxmw-nif = { path = "crates/rtxmw-nif" }
rtxmw-scene = { path = "crates/rtxmw-scene" }
rtxmw-vfs = { path = "crates/rtxmw-vfs" }

ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
dhat = "0.3"
dotenvy = "0.15"
raw-window-handle = "0.6"
glam = "0.33"
half = "2"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
png = "0.18"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

# `line-tables-only` on every profile: enough for a symbolised backtrace and a usable profiler,
# without the build-time and binary-size cost of full debug info.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

# Asset decoding (BSA, NIF, DDS) is unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
