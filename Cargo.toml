[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rtxmw-esm = { path = "crates/rtxmw-esm" }
rtxmw-gpu = { path = "crates/rtxmw-gpu" }
rtxmw-nif = { path = "crates/rtxmw-nif" }
rtxmw-render = { path = "crates/rtxmw-render" }
rtxmw-scene = { path = "crates/rtxmw-scene" }
rtxmw-texture = { path = "crates/rtxmw-texture" }
rtxmw-vfs = { path = "crates/rtxmw-vfs" }

ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
# No default features: the colour stack (anstream and friends) is seven crates of terminal styling
# that a renderer's command line has no use for. `help`, `usage` and `error-context` are what make a
# failed parse say what was wrong and how to ask properly.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }
dhat = "0.3"
dotenvy = "0.15"
raw-window-handle = "0.6"
glam = "0.33"
half = "2"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
png = "0.18"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.test]
debug = "line-tables-only"

[profile.bench]
lto = "thin"
debug = "line-tables-only"

[profile.release]
lto = "thin"
debug = "line-tables-only"

[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"
