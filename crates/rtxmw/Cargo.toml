[package]
name = "rtxmw"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# **On by default**, so that a plain `cargo run` is the engine with everything it has switched on —
# which is the build worth looking at. The cost is that it needs NVIDIA's NGX SDK on disk, and
# `.refs/` is gitignored: a fresh clone builds only once the SDK is fetched there or `DLSS_SDK_DIR`
# points at it. `--no-default-features` is the way out.
default = ["dlss"]
dlss = ["rtxmw-render/dlss"]

[dependencies]
rtxmw-gpu.workspace = true
rtxmw-render.workspace = true
rtxmw-scene.workspace = true
rtxmw-texture.workspace = true
rtxmw-vfs.workspace = true

ash.workspace = true
bytemuck.workspace = true
clap.workspace = true
glam.workspace = true
raw-window-handle.workspace = true
winit.workspace = true
