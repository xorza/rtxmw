[package]
name = "rtxmw-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# DLSS Ray Reconstruction through NGX. Off by default because it needs NVIDIA's SDK on disk, which
# is not redistributable and so is not in this repository — see `build.rs` for where it is looked
# for. Everything else builds and runs without it.
dlss = []

[dependencies]
ash.workspace = true
bytemuck.workspace = true
glam.workspace = true
rtxmw-gpu.workspace = true
rtxmw-scene.workspace = true
rtxmw-texture = { workspace = true, features = ["internals"] }

[dev-dependencies]
dhat.workspace = true
rtxmw-gpu = { workspace = true, features = ["internals"] }
rtxmw-vfs = { workspace = true, features = ["internals"] }

# Installs a global allocator, so it needs its own binary.
[[test]]
name = "frame_allocations"
